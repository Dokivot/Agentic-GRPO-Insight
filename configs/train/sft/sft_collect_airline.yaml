# SFT 数据采集配置
# 双卡 A800 分离部署：
#   GPU 0 (port 8000): 72B-AWQ 当 policy 跑 trajectory
#   GPU 1 (port 8001): 72B-AWQ 当 user simulator
env:
  name: airline
  user_strategy: llm
  user_model: "Qwen/Qwen2.5-72B-Instruct-AWQ"
  user_provider: openai
  user_base_url: "http://localhost:8001/v1"
  task_split: test

policy:
  model_name: "Qwen/Qwen2.5-72B-Instruct-AWQ"
  base_url: "http://localhost:8000/v1"
  top_p: 0.9
  max_tokens: 512

collect:
  best_of_n: 16
  temperatures: [0.0, 0.0, 0.0, 0.0, 0.5, 0.5, 0.5, 0.5, 0.8, 0.8, 0.8, 0.8, 1.0, 1.0, 1.0, 1.0]
  max_turns: 30
  num_workers: 4
  holdout_size: 10

output:
  dir: "experiments/sft_collect_airline"
