[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doproj-agentic-rl"
version = "0.1.0"
description = "Agentic RL 研究：vanilla GRPO 在 tau-bench-airline 上的失效模式"
requires-python = ">=3.10"

[tool.setuptools]
packages = [
    "src",
    "src.envs",
    "src.models",
    "src.evaluation",
    "src.training",
    "src.tau_bench",
    "src.analysis",
    "src.utils",
]

[tool.setuptools.package-dir]
src = "src"
"src.envs" = "src/envs"
"src.models" = "src/models"
"src.evaluation" = "src/evaluation"
"src.training" = "src/training"
"src.tau_bench" = "src/tau_bench"
"src.analysis" = "src/analysis"
"src.utils" = "src/utils"
